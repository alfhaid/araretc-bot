<script>
const ICONS = {
  key:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="m10.8 12.2 8.2-8.2"></path><path d="m17 6 2 2"></path><path d="m14 9 2 2"></path></svg>',
  shield:  '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.3-8 9-4.6-.7-8-4-8-9V6l8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>',
  book:    '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2Z"></path><path d="M4 19h15"></path></svg>',
  app:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M11 18h2"></path></svg>',
  bot:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="3"></rect><circle cx="9" cy="14.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15" cy="14.5" r="1.2" fill="currentColor" stroke="none"></circle><path d="M12 9V5"></path><circle cx="12" cy="3.5" r="1.5"></circle></svg>',

};
const COLORS = {
  key:     { ic: "#c2620f", br: "#a8510f" },
  shield:  { ic: "#1f8a5c", br: "#2f9e6a" },
  book:    { ic: "#1d76b8", br: "#2e86c8" },
  app:     { ic: "#6354b8", br: "#7a6cc4" },
  library: { ic: "#2a8a74", br: "#3f9c86" },
  screen:  { ic: "#3a6fb0", br: "#2c5690" },
  bot:     { ic: "#b0308f", br: "#8a2270" },
  support: { ic: "#1b6d9c", br: "#1f6f9e" }
};
const CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d87a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';

function render(id, items) {
  document.getElementById(id).innerHTML = items.map(function (it) {
    var c = COLORS[it.icon] || COLORS.book;
    return '<a class="row" href="' + it.url + '" target="_blank" rel="noopener" style="margin-bottom:12px;border-right-color:' + c.br + '">' +
      '<span class="ic" style="color:' + c.ic + '">' + (ICONS[it.icon] || ICONS.book) + '</span>' +
      '<span class="t">' + it.title + '</span>' + CHEV +
    '</a>';
  }).join('');
}
render('account', ACCOUNT);
render('guides', GUIDES);
render('resources', RESOURCES);
document.getElementById('supportRow').href = SUPPORT_TELEGRAM;
</script>
